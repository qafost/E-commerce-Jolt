<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basket | Stuffsus</title>
  <link rel="stylesheet" href="src/css/main.css">
  <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>
  <main class="page-wrap">
    <div class="split">
      <div class="card">
        <h2>Your basket</h2>
        <div id="pageCart"></div>
      </div>
      <aside class="card">
        <h3>Summary</h3>
        <div class="steck tight"><span>Total</span><strong id="pageTotal">$0.00</strong></div>
        <button class="btn full" id="pageCheckout" type="button">Checkout</button>
        <a class="text-btn" href="shop.html">Continue shopping</a>
      </aside>
    </div>
  </main>
  <div id="site-shell"></div>
  <script src="src/javascript/data.js"></script>
  <script src="src/javascript/store.js"></script>
  <script src="src/javascript/pages.js"></script>
</body>
</html>
