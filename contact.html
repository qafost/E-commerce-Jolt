<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Stuffsus</title>
  <link rel="stylesheet" href="src/css/main.css">
  <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main class="page-wrap">
    <div class="split">
      <form class="form card" id="contactForm">
        <h2>Write to us</h2>
        <label>Name<input name="name" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Message<textarea name="message" rows="5" required></textarea></label>
        <button class="btn" type="submit">Send</button>
      </form>
      <aside class="card">
        <h3>Studio</h3>
        <p>Maadi, Cairo<br>Egypt</p>
        <p>hello@stuffsus.store</p>
        <p class="muted">Mon–Fri, 10:00–18:00 Cairo time</p>
      </aside>
    </div>
  </main>
  <div id="site-shell"></div>
  <script src="src/javascript/data.js"></script>
  <script src="src/javascript/store.js"></script>
</body>
</html>
